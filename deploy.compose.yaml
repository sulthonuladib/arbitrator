# Production-ish stack for the Arbitrator services.
#
# Kept separate from `compose.yaml` (local development infra) so the two can run
# side by side: this file sets its own Compose project name, network and volumes.
#
#   docker compose -f deploy.compose.yaml up --build
#
# Only nginx is published on the host (80/443); it terminates TLS and proxies
# the UI, which is reachable only on the Compose network. The lister, sender and
# receiver talk to each other over that same network. The RabbitMQ management UI
# is exposed the same way, under the path prefix /rabbitmq/ (its 15672 port is
# never published).
#
# TLS certs are bind-mounted from `infra/certs/` (see infra/nginx/README.md).
# Generate them before the first start, or nginx will fail to boot:
#
#   ./scripts/local-certs.sh    # mkcert, for <hostname>.local
#   # or ./scripts/letsencrypt-cert.sh <domain> <email> for a public domain
name: arbitrator-deploy

x-database-env: &database-env
    DATABASE_URL: postgres://${DATABASE_USER:-postgres}:${DATABASE_PASSWORD:-postgres}@postgresql:5432/${DATABASE_NAME:-arbitrator}

x-amqp-env: &amqp-env
    AMQP_URL: amqp://${RABBITMQ_USER:-arbitrator}:${RABBITMQ_PASSWORD:-arbitrator}@rabbitmq:5672
    AMQP_EXCHANGE: ${AMQP_EXCHANGE:-arbitrator}

x-redis-env: &redis-env
    REDIS_URL: redis://redis:6379

services:
    postgresql:
        image: postgres:18.6-alpine
        restart: unless-stopped
        command: ["postgres", "-c", "max_connections=10000"]
        environment:
            POSTGRES_USER: ${DATABASE_USER:-postgres}
            POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
            POSTGRES_DB: ${DATABASE_NAME:-arbitrator}
        volumes:
            # PG18 changed the image's PGDATA to /var/lib/postgresql/18/docker
            # and the declared VOLUME to /var/lib/postgresql (was .../data).
            - postgres-data:/var/lib/postgresql
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${DATABASE_USER:-postgres} -d ${DATABASE_NAME:-arbitrator}",
                ]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 10s

    rabbitmq:
        image: rabbitmq:4-management-alpine
        restart: unless-stopped
        environment:
            RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-arbitrator}
            RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-arbitrator}
        volumes:
            - rabbitmq-data:/var/lib/rabbitmq
            # Serves the management UI/API under /rabbitmq; see the file.
            - ./infra/rabbitmq/conf.d/20-path-prefix.conf:/etc/rabbitmq/conf.d/20-path-prefix.conf:ro
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
            interval: 10s
            timeout: 10s
            retries: 10
            start_period: 20s

    redis:
        image: redis:7.4-alpine
        restart: unless-stopped
        volumes:
            - redis-data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 10s

    # One-shot `drizzle-kit migrate`; lister waits for it to finish.
    lister-migrate:
        build:
            context: .
            dockerfile: apps/lister/Dockerfile
            target: migrate
        environment:
            <<: *database-env
            NODE_ENV: production
        depends_on:
            postgresql:
                condition: service_healthy
        restart: "no"

    lister:
        build:
            context: .
            dockerfile: apps/lister/Dockerfile
        image: arbitrator-lister:latest
        restart: unless-stopped
        environment:
            <<: [*database-env, *amqp-env, *redis-env]
            NODE_ENV: production
        depends_on:
            postgresql:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
            redis:
                condition: service_healthy
            lister-migrate:
                condition: service_completed_successfully
        expose:
            - "3001"
        healthcheck:
            test:
                [
                    "CMD",
                    "bun",
                    "-e",
                    "const r = await fetch('http://127.0.0.1:3001/'); process.exit(r.status < 500 ? 0 : 1)",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

    sender:
        build:
            context: .
            dockerfile: apps/sender/Dockerfile
        image: arbitrator-sender:latest
        restart: unless-stopped
        environment:
            <<: *amqp-env
            LISTER_URL: http://lister:3001
            NODE_ENV: production
        depends_on:
            lister:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
        expose:
            - "3002"
        healthcheck:
            test:
                [
                    "CMD",
                    "bun",
                    "-e",
                    "const r = await fetch('http://127.0.0.1:3002/exchanges'); process.exit(r.ok ? 0 : 1)",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

    receiver:
        build:
            context: .
            dockerfile: apps/receiver/Dockerfile
        image: arbitrator-receiver:latest
        # On a freshly migrated database the `exchange` table is empty, so the
        # workers find no queues to consume and exit 0. `unless-stopped` makes the
        # receiver keep retrying, so it picks up exchanges as soon as the catalog is
        # populated (Docker backs the restarts off up to a minute).
        restart: unless-stopped
        # Reap the worker processes main.ts spawns and forward signals to it.
        init: true
        environment:
            <<: [*database-env, *amqp-env, *redis-env]
            LISTER_URL: http://lister:3001
            NODE_ENV: production
        depends_on:
            lister:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
            redis:
                condition: service_healthy

    ui:
        build:
            context: .
            dockerfile: apps/ui/Dockerfile
        image: arbitrator-ui:latest
        restart: unless-stopped
        environment:
            LISTER_URL: http://lister:3001
            SENDER_URL: http://sender:3002
            NODE_ENV: production
        depends_on:
            lister:
                condition: service_healthy
            sender:
                condition: service_healthy
        expose:
            - "3000"
        healthcheck:
            test:
                [
                    "CMD",
                    "bun",
                    "-e",
                    "const r = await fetch('http://127.0.0.1:3000/'); process.exit(r.ok ? 0 : 1)",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

    # The only published service: terminates TLS and proxies the UI over the
    # Compose network (the same template as the dev nginx, different upstream).
    nginx:
        image: nginx:1.27-alpine
        restart: unless-stopped
        environment:
            UI_UPSTREAM: ui:3000
            # RabbitMQ management (UI + HTTP API). Port 15672 stays unpublished;
            # nginx is the only way in, at https://$LOCAL_DOMAIN/rabbitmq/.
            RABBITMQ_MANAGEMENT_UPSTREAM: rabbitmq:15672
            # The single vhost (`server_name`). Must be covered by the cert SAN.
            LOCAL_DOMAIN: ${LOCAL_DOMAIN:-localhost}
            # Only substitute our variables; leave nginx's own $host, $scheme, etc.
            NGINX_ENVSUBST_FILTER: "^(UI_UPSTREAM|RABBITMQ_MANAGEMENT_UPSTREAM|LOCAL_DOMAIN)$$"
        depends_on:
            ui:
                condition: service_healthy
        ports:
            - "${NGINX_HTTP_PORT:-80}:80"
            - "${NGINX_HTTPS_PORT:-443}:443"
        volumes:
            - ./infra/nginx/templates:/etc/nginx/templates:ro
            - ./infra/certs:/etc/nginx/certs:ro
            - ./infra/certbot/www:/var/www/certbot:ro
        healthcheck:
            # HTTPS on loopback: the cert is for LOCAL_DOMAIN, not 127.0.0.1.
            test:
                [
                    "CMD",
                    "wget",
                    "-q",
                    "-O",
                    "/dev/null",
                    "--no-check-certificate",
                    "https://127.0.0.1/",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

    # Opt-in one-off CLI runner (profile `tools`), never started by `up`.
    # It reuses the deployed Postgres/Redis/RabbitMQ/lister, so scripts do not
    # talk to localhost:
    #
    #   docker compose -f deploy.compose.yaml build tools
    #   docker compose -f deploy.compose.yaml run --rm \
    #       --workdir /app/apps/cmc-collector tools bun run indodax
    #
    # Swap `--workdir` for apps/chain-metadata-collector or
    # apps/old-lister-migrator, or pass `bun run src/<file>.ts` for ad-hoc work.
    tools:
        profiles: ["tools"]
        build:
            context: .
            dockerfile: infra/Dockerfile.tools
        image: arbitrator-tools:latest
        environment:
            <<: [*database-env, *amqp-env, *redis-env]
            LISTER_URL: http://lister:3001
            NODE_ENV: production
            # Optional external APIs; blank means the integration is skipped.
            CMC_API_KEY: ${CMC_API_KEY:-}
            MEXC_API_KEY: ${MEXC_API_KEY:-}
            MEXC_API_SECRET: ${MEXC_API_SECRET:-}
            OKX_API_KEY: ${OKX_API_KEY:-}
            OKX_API_SECRET: ${OKX_API_SECRET:-}
            OKX_API_PASSPHRASE: ${OKX_API_PASSPHRASE:-}
            BYBIT_API_KEY: ${BYBIT_API_KEY:-}
            BYBIT_API_SECRET: ${BYBIT_API_SECRET:-}
        depends_on:
            lister:
                condition: service_healthy
        volumes:
            # Snapshots persist across `--rm` runs (scrape, then import).
            - cmc-data:/app/apps/cmc-collector/data
            - chain-metadata-data:/app/apps/chain-metadata-collector/data

volumes:
    postgres-data:
    rabbitmq-data:
    redis-data:
    cmc-data:
    chain-metadata-data:
