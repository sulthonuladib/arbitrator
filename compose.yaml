services:
  postgresql:
    image: postgres:17.6-alpine
    container_name: arbitrator-postgres
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=10000"]
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      POSTGRES_DB: ${DATABASE_NAME:-arbitrator}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  nats:
    image: nats:2.12-alpine
    restart: unless-stopped
    container_name: arbitrator-nats
    command: ["-c", "/etc/nats/nats-server.conf"]
    ports:
      - "4222:4222"
      - "8222:8222"
      - "9222:9222"
    volumes:
      - ./docker/nats/nats-server.conf:/etc/nats/nats-server.conf
      - nats-data:/data

  nats-ui:
    image: ghcr.io/gastbob40/nats-ui:latest
    container_name: arbitrator-nats-ui
    ports:
      - "9387:3000"
    depends_on:
      - nats
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      - NODE_ENV=production

