services:
    postgresql:
        image: postgres:18.6-alpine
        container_name: arbitrator-postgres
        restart: unless-stopped
        command: ["postgres", "-c", "max_connections=10000"]
        environment:
            POSTGRES_USER: ${DATABASE_USER:-postgres}
            POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
            POSTGRES_DB: ${DATABASE_NAME:-arbitrator}
        ports:
            - "${POSTGRES_PORT:-5432}:5432"
        volumes:
            # PG18 changed the image's PGDATA to /var/lib/postgresql/18/docker
            # and the declared VOLUME to /var/lib/postgresql (was .../data).
            - postgres-data:/var/lib/postgresql

    nginx:
        image: nginx:1.27-alpine
        container_name: arbitrator-nginx
        restart: unless-stopped
        environment:
            # The UI dev server runs on the host (bun --watch) on port 3000.
            # host.docker.internal points back at the host from inside the container.
            UI_UPSTREAM: ${UI_UPSTREAM:-host.docker.internal:3000}
            # RabbitMQ management (UI + HTTP API), same path-prefix mount as the
            # deploy stack so https://<LOCAL_DOMAIN>/rabbitmq/ works here too.
            RABBITMQ_MANAGEMENT_UPSTREAM: host.docker.internal:15672
            # The single hostname nginx serves (the host's own mDNS name).
            LOCAL_DOMAIN: ${LOCAL_DOMAIN:-condor.local}
            # Only substitute our variables; leave nginx's own $host, $scheme, etc.
            NGINX_ENVSUBST_FILTER: "^(UI_UPSTREAM|RABBITMQ_MANAGEMENT_UPSTREAM|LOCAL_DOMAIN)$$"
        ports:
            - "${NGINX_HTTP_PORT:-80}:80"
            - "${NGINX_HTTPS_PORT:-443}:443"
        extra_hosts:
            - "host.docker.internal:host-gateway"
        volumes:
            - ./infra/nginx/templates:/etc/nginx/templates:ro
            - ./infra/certs:/etc/nginx/certs:ro
            - ./infra/certbot/www:/var/www/certbot:ro

    rabbitmq:
        image: rabbitmq:4-management-alpine
        container_name: arbitrator-rabbitmq
        restart: unless-stopped
        environment:
            RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-arbitrator}
            RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-arbitrator}
        ports:
            - "5672:5672" # AMQP
            - "15672:15672" # HTTP API
        volumes:
            - rabbitmq-data:/var/lib/rabbitmq
            # Serves the management UI/API under /rabbitmq (nginx mounts it).
            - ./infra/rabbitmq/conf.d/20-path-prefix.conf:/etc/rabbitmq/conf.d/20-path-prefix.conf:ro
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
            interval: 30s
            timeout: 10s
            retries: 5

    redis:
        image: redis:7.4-alpine
        container_name: arbitrator-redis
        restart: unless-stopped
        ports:
            - "${REDIS_PORT:-6379}:6379"
        volumes:
            - redis-data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 30s
            timeout: 10s
            retries: 5

volumes:
    rabbitmq-data:
    postgres-data:
    redis-data:
