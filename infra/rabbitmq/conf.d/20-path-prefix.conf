## Mounted into the RabbitMQ container as /etc/rabbitmq/conf.d/20-path-prefix.conf.
##
## The management plugin (UI + HTTP API) is served under /rabbitmq so nginx can
## mount it at https://<LOCAL_DOMAIN>/rabbitmq/ — the container's port 15672 is
## never published on the host. Because the prefix lives here, nginx forwards the
## URI unchanged (no prefix strip), which keeps asset URLs, the session cookie
## path and the /rabbitmq/api XHRs consistent.
##
## Tooling that talks to the HTTP API on the host now needs the prefix too, e.g.
##   rabbitmqadmin --base-path /rabbitmq ...
## https://www.rabbitmq.com/docs/management#path-prefix
management.path_prefix = /rabbitmq
